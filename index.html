<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR Code</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <p>Digite o texto ou URL:</p>
        <input type="text" placeholder="Digite o texto ou URL" id="qrText">

        <div id="imgBox">
            <img src="" id="qrCodeImage">
        </div>

        <button onclick="gerarQRCode()">Gerar QR Code</button>
    </div>

    <script>
        let imgBox = document.getElementById("imgBox");
        let qrCodeImage = document.getElementById("qrCodeImage");
        let qrText = document.getElementById("qrText");

        function gerarQRCode() {
            if(qrText.value.length > 0){
                qrCodeImage.src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(qrText.value);
           imgBox.classList.add("show-img");
            }else{
                qrText.classList.add("error");
                setTimeout(() => {
                    qrText.classList.remove("error");
                }, 1000);
            }
           
        }
    </script>
</body>
</html>
